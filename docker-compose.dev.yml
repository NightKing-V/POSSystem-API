services:
  api:
    build: 
      context: ./possystem-api
      target: builder # We use the stage that has devDependencies
    ports:
      - "3300:3000"
    volumes:
      - ./possystem-api:/app
      - /app/node_modules # This is a "trick" to keep container modules separate from local ones
    environment:
      - NODE_ENV=development
    command: npm run start:dev # This tells Nest to watch for changes